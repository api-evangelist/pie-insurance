components:
  schemas:
    EligibilityAnswerPost:
      title: EligibilityAnswer
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
        answer:
          type:
          - string
          - 'null'
      additionalProperties: false
    PremiumDetails:
      required:
      - catastrophe
      - classPremium
      - expenseConstant
      - experienceModifier
      - minimumPremium
      - modifiedPremium
      - policyTotalEstimatedCost
      - premiumDiscount
      - scheduleModifier
      - standardPremium
      - subjectPremium
      - taxesAndAssessments
      - territoryModifier
      - terrorism
      - totalEstimatedPremium
      - totalTaxesAndAssessments
      type: object
      properties:
        catastrophe:
          type: number
          format: double
        classPremium:
          type: number
          format: double
        expenseConstant:
          type: number
          format: double
        experienceModifier:
          type: number
          format: double
        liabilityLimits:
          type:
          - integer
          - 'null'
          format: int32
        minimumPremium:
          type: integer
          format: int32
        modifiedPremium:
          type: integer
          format: int32
        policyTotalEstimatedCost:
          type: number
          format: double
        premiumDiscount:
          type: integer
          format: int32
        scheduleModifier:
          type: number
          format: double
        standardPremium:
          type: integer
          format: int32
        subjectPremium:
          type: integer
          format: int32
        taxesAndAssessments:
          type: array
          items:
            $ref: '#/components/schemas/TaxDetails'
        totalTaxesAndAssessments:
          type: number
          format: double
        terrorism:
          type: number
          format: double
        totalEstimatedPremium:
          type: number
          format: double
        blanketWaiver:
          type:
          - integer
          - 'null'
          format: int32
        specificWaiver:
          type:
          - integer
          - 'null'
          format: int32
        territoryModifier:
          type: integer
          format: int32
      additionalProperties: false
    BusinessAddress:
      type: object
      properties:
        line1:
          type:
          - string
          - 'null'
        line2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        zip:
          type:
          - string
          - 'null'
        county:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    Countries:
      enum:
      - US
      - USA
      type: string
    ExperienceModificationPost:
      title: ExperienceModification
      type: object
      properties:
        factor:
          type:
          - number
          - 'null'
          description: Valid values are >= 0.1 and less than 10.0
        type:
          type:
          - string
          - 'null'
          description: 'Acceptable string values for all states (except California)

            "Actual"

            "Contingent"

            "Estimated" (default value)

            "Preliminary"

            "Tentative"


            Acceptable string values for California

            "Actual"

            "Expiring"

            "Tentative" (default value)'
        date:
          type:
          - string
          - 'null'
          description: 'Format YYYY-MM-DD

            Required when type is "Actual"

            Optional for all other values of Type

            Default value to current day'
          format: date
        riskId:
          type:
          - string
          - 'null'
      additionalProperties: false
    PriorCarrierPost:
      title: PriorCarrier
      required:
      - effectiveDate
      - expirationDate
      - lapseInPeriod
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        effectiveDate:
          type: string
          description: Format YYYY-MM-DD
          format: date
        expirationDate:
          type: string
          description: Format YYYY-MM-DD
          format: date
        lapseInPeriod:
          type: boolean
          description: Was there a lapse in coverage
        lapseReason:
          $ref: '#/components/schemas/LapseReason'
        lapseReasonDescription:
          type:
          - string
          - 'null'
          description: Provide description when lapseReason is ‘Other’ or when there is additional lapse information available.
        policyNumber:
          type:
          - string
          - 'null'
        modificationFactor:
          type:
          - number
          - 'null'
          description: Must be decimal number >= 0.1 and less than 10.0
        totalPremium:
          type:
          - number
          - 'null'
          description: 'Must be number with no more than 2 decimal places

            e.g. xxx.yy'
        nonZeroClaimCount:
          type: integer
          description: 'The number of claims where the total payout was greater than zero.

            Must be integer >= 0 and less than or equal to 255'
          format: int32
        zeroClaimCount:
          type: integer
          description: 'The number of claims where the total payout equals zero.

            Must be integer >= 0 and less than or equal to 255'
          format: int32
        amountPaid:
          type:
          - number
          - 'null'
          description: 'Must be number with no more than 2 decimal places

            e.g. xxx.yy'
        amountReserved:
          type:
          - number
          - 'null'
          description: 'Must be number with no more than 2 decimal places

            e.g. xxx.yy'
        amountIncurred:
          type:
          - string
          - 'null'
          description: 'Must be number with no more than 2 decimal places

            e.g. xxx.yy'
      additionalProperties: false
    QuoteRequestPost:
      title: Request
      type: object
      properties:
        namedInsured:
          type:
          - string
          - 'null'
          description: Do not include the 'doing business as' name in this field.  Use the DBA field in the LegalEntity Object.
        effectiveDate:
          type:
          - string
          - 'null'
          description: " Format YYYY-MM-DD\nMust be between tomorrow's date and 120 from current date\n (today + 120 days >= effectiveDate >= tomorrow)"
          format: date
        partnerAgentFirstName:
          type:
          - string
          - 'null'
        partnerAgentLastName:
          type:
          - string
          - 'null'
        partnerAgentEmail:
          type:
          - string
          - 'null'
        expirationDate:
          type:
          - string
          - 'null'
          description: 'Format YYYY-MM-DD

            Must be exactly one year after effectiveDate'
          format: date
        description:
          type:
          - string
          - 'null'
        workersCompensation:
          $ref: '#/components/schemas/WorkCompPolicyPost'
        mailingAddress:
          $ref: '#/components/schemas/QuoteAddressPost'
        contacts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuoteContactPost'
        eligibilityAnswers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EligibilityAnswerPost'
      additionalProperties: false
    ContactTypes:
      enum:
      - Accounting
      - Claims
      - Inspection
      - Client
      - Other
      type: string
    NotCoveredReason:
      enum:
      - NonPayment
      - AuditNonCompliance
      - NoEmployees
      - Other
      - NewBusiness
      type: string
    Payment:
      type: object
      properties:
        premiumAmount:
          type: integer
          format: int32
        surchargeAmount:
          type:
          - integer
          - 'null'
          format: int32
        feeAmount:
          type:
          - integer
          - 'null'
          format: int32
        totalAmount:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
    ClassCodeQuote:
      required:
      - classCode
      - description
      - payroll
      - percentageOfPayroll
      - premium
      - rate
      - state
      type: object
      properties:
        classCode:
          type: string
        description:
          type: string
        payroll:
          type: integer
          format: int32
        state:
          type: string
        premium:
          type: integer
          format: int32
        rate:
          type: number
          format: double
        percentageOfPayroll:
          type: number
          format: double
      additionalProperties: false
    QuoteExposurePost:
      title: Exposure
      type: object
      properties:
        class:
          type:
          - string
          - 'null'
          description: "Subclasses not currently accepted\n \n Must be integer with 1-4 digits"
        payroll:
          type:
          - integer
          - 'null'
          description: Valid range is >= 0 and less than 1,000,000,000
          format: int32
      additionalProperties: false
    LapseReason:
      enum:
      - NonPayment
      - AuditNonCompliance
      - NoEmployees
      - Other
      type: string
    Contact:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type:
          - string
          - 'null'
        email:
          type: string
        agentEnteredEmail:
          type:
          - string
