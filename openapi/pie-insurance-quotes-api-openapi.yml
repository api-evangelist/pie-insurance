          description: Unauthorized - Invalid agency code provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
      security:
      - bearer: []
      x-summary-source: derived
      operationId: postQuotes
      x-operation-id-source: derived
