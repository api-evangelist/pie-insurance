openapi: 3.2.0
info:
  title: Pie Insurance Quote Quotes API
  version: v1
servers:
- url: https://api.post-prod.pieinsurance.com/api/v1
security:
- bearer: []
tags:
- name: Quotes
paths:
  /Quotes:
