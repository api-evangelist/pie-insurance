apis:
  - aid: pie-insurance:pie-insurance-partner-api
    name: Pie Insurance Partner API
    description: >-
      REST/JSON Partner API (OpenAPI 3.0.4) that lets independent agencies and
      partner platforms quote and bind Pie workers' compensation insurance
      without leaving their own experience. Endpoints cover class-code search,
      eligibility questions, appetite (single-class and full-state catalog),
      price indications, full bindable quotes with create/get/update, quote
      document upload, and quote PDF retrieval. Base URL
      https://api.post-prod.pieinsurance.com/api/v1. Credentials are issued by
      Pie partner onboarding; Swagger UI is published at
      api.post-prod.pieinsurance.com/api/docs.
    humanURL: https://www.pieinsurance.com/agency/api
    baseURL: https://api.post-prod.pieinsurance.com/api/v1
