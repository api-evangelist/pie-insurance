aid: pie-insurance
name: Pie Insurance
description: >-
  Pie Insurance is a Washington, DC and Denver-based insurtech founded in May
  2017 that makes commercial insurance for small businesses, with workers'
  compensation as its flagship line. Pie underwrites its own workers' comp
  through The Pie Insurance Company (NAIC 21857) — the carrier formerly known
  as Pie Casualty Insurance Company, which Pie acquired as Western Select
  Insurance Company in 2021 and took full-stack in February 2023 with an A-
  (Excellent) rating from AM Best. In addition to workers' comp, Pie offers
  business owners policy (BOP), commercial auto, general liability,
  professional liability, and errors and omissions through partner carriers.
  The product is sold both direct-to-business and through a partner network of
  4,000+ independent insurance agencies, who quote, bind, and service policies
  via the Pie agency portal and the Pie Partner API. The Partner API
  (api.post-prod.pieinsurance.com, REST/JSON, documented with OpenAPI 3.0.4)
  exposes class-code search, eligibility questions, appetite checks, price
  indications, full bindable quotes, quote documents, and quote PDF retrieval
  so agency management systems and partner platforms can embed the Pie
  workers' comp experience without redirecting users off-platform. Coverage
  is available in 39 states plus DC; 73% of submissions are auto-decided and
  average quote time is roughly three minutes. The company has raised
  approximately $621M across Seed through Series D from investors including
  Allianz X, SVB Capital, Greycroft, Aspect Ventures, and Elefund. CEO and
  co-founder is John Swigart. The Pie Partner API is the public developer
  surface; there is no broader open-source SDK or GitHub organization.
